<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Bewerbungstracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: weiße Seite. Kopf, "Als Nächstes", fester Entscheidungsbaum über die volle Breite (schmal als eingerückte Liste), darunter Auge/Angebote und die Details. Bewusst nur helles Design. */
:root{
  --bg:#FFFFFF; --soft:#F7F7F8; --hover:#F1F1F3; --ink:#0B0B0F; --ink2:#3F3F46; --muted:#7E7E88; --line:#E7E7EB; --line2:#CFCFD6;
  --c-prep:#E5A500; --c-bew:#18181B; --c-t:#EA580C; --c-g:#0EA5E9; --c-g2:#1D4ED8; --c-z:#16A34A; --c-a:#DC2626;
  --late:#C2410C;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.page{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);padding-block:26px 72px;display:flex;flex-direction:column;gap:24px}
.c-prep{--c:var(--c-prep)} .c-bew{--c:var(--c-bew)} .c-t{--c:var(--c-t)} .c-g{--c:var(--c-g)} .c-g2{--c:var(--c-g2)} .c-z{--c:var(--c-z)} .c-a{--c:var(--c-a)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--line2));flex:none;display:inline-block}

/* Kopf */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
.brand{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em}
.stats{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted)}
.stats li{display:inline-flex;align-items:center;gap:7px}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:32px;border-radius:8px;padding:0 12px;border:1px solid var(--line2);background:var(--bg);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover:not(:disabled){background:#27272A}
.btn:disabled{opacity:.35;cursor:not-allowed}
.status{font-size:12px;color:var(--muted)}
.status.err{color:var(--c-a)}

/* Als Nächstes */
.nexts-box{border:1px solid var(--line);border-radius:12px;padding:12px 14px 6px}
.sl{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.agenda{list-style:none;margin:0;padding:0}
.agenda li{display:grid;grid-template-columns:78px 12px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:36px;border-top:1px solid var(--line);padding:0 4px;cursor:pointer}
.agenda li:first-child{border-top:0}
.agenda li:hover{background:var(--soft)}
.agenda li.static{cursor:default;grid-template-columns:1fr}
.agenda li.static:hover{background:none}
.agenda .d{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.agenda .w{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda .w span{color:var(--muted)}
.art.as{background:#FEF3C7;color:#92400E}
.er,.row .co > span.rl{display:flex;align-items:center;min-width:0}
.er .rt,.rl .rt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.er .art,.rl .art{flex:none}
.pill .art{margin-left:0}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--hover);color:var(--ink2)}
.tag.soon{background:var(--c,var(--ink));color:#fff}
.tag.late{background:#FFEDD5;color:var(--late)}
.tag.need{background:#FEF3C7;color:#92400E}
.linkbtn{border:0;background:none;padding:0;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.linkbtn:hover{color:var(--ink)}

/* Baum */
.tree{position:relative;width:100%;min-height:120px}
#wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.nb{position:absolute;border-radius:12px;padding:6px 8px 10px;margin:-6px 0 0 -8px;transition:background .12s,box-shadow .12s}
.nb.sel{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.nb.drop-on{background:color-mix(in srgb,var(--c) 10%,#fff);box-shadow:inset 0 0 0 2px var(--c)}
body.dragging .nb{box-shadow:inset 0 0 0 1px var(--line)}
.nh{display:flex;align-items:center;gap:8px;height:26px;cursor:pointer;border-radius:7px;min-width:0;padding-right:6px}
.nh:hover .nl{text-decoration:underline;text-underline-offset:3px}
.nd{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px var(--bg)}
.nl{font-size:13.5px;font-weight:600;white-space:nowrap}
.nc{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.nb.empty .nl{color:var(--muted);font-weight:500}
.ents{display:flex;flex-direction:column;gap:6px;margin:6px 0 0 14px}
.ent{position:relative;height:70px;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:6px 10px 6px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y;min-width:0}
.ent:hover{border-color:var(--c);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ent.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ent.soon{border-color:var(--c);box-shadow:0 0 0 1.5px var(--c),0 2px 10px color-mix(in srgb,var(--c) 30%,transparent)}
.ent.lifted{opacity:.3}
.grip{position:absolute;left:3px;top:50%;transform:translateY(-50%);width:4px;height:18px;background:radial-gradient(circle,var(--line2) 1px,transparent 1.4px) 0 0/4px 4px;opacity:.9}
.en{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.er{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.art{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink2);background:var(--hover);border-radius:4px;padding:0 4px;margin-left:5px}
.es{font-size:11.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);margin-top:2px}
.es.muted{color:var(--muted)}
.es.late{color:var(--late);font-weight:500}
.es.ok{color:var(--c-z);font-weight:600}
.es .b{display:inline-block;font-weight:600;color:#fff;background:var(--c);border-radius:5px;padding:0 6px}
.need{display:flex;align-items:center;gap:6px;height:22px;margin-top:2px;padding:0 4px 0 7px;border:1px dashed var(--c);border-radius:6px;background:color-mix(in srgb,var(--c) 9%,#fff);cursor:text}
.need span{font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap}
.need input{border:0;background:transparent;font-family:var(--mono);font-size:11.5px;padding:0;min-width:0;flex:1;outline:none;color:var(--ink)}
.c-bew .need{border-color:var(--c-prep);background:#FFFBEB}
.more{margin:4px 0 0 14px;border:0;background:none;padding:2px 0;font-size:12px;color:var(--muted);text-align:left}
.more:hover{color:var(--ink)}
.ghostchip{position:fixed;z-index:50;pointer-events:none;padding:8px 12px;border-radius:9px;background:var(--bg);border:1px solid var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.18);font-size:13px;font-weight:600;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translate(-18px,-18px) rotate(-1.5deg)}

/* schmal: eingerückte Liste */
.tree.outline .nb{position:relative;left:auto!important;top:auto!important;width:auto!important;margin:0;padding:6px 8px 8px}
.tree.outline .nbw{position:relative;border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tree.outline .nbw.root{border-left:0;margin-left:0;padding-left:0}

/* Unter dem Baum */
.below{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:18px}
.toolbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.tb{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);font-size:13px;font-weight:500;color:var(--ink2)}
.tb:hover{background:var(--hover)}
.tb[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tb svg{width:18px;height:18px}
.tb .n{font-family:var(--mono);font-size:12px;opacity:.75}
.dh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:15px;font-weight:600;margin:0}
.crumb .sep{color:var(--line2);font-weight:400}
.crumb .cnt{font-family:var(--mono);font-weight:400;font-size:12.5px;color:var(--muted);margin-left:4px}
.xbtn{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--muted);font-size:15px}
.xbtn:hover{background:var(--hover);color:var(--ink)}
.ctrl{display:flex;flex-direction:column;gap:10px}
.ctrl .r{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctrl .lab{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:92px;flex:none}
.pill{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.pill:hover{background:var(--hover)}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill .dot{width:8px;height:8px;box-shadow:0 0 0 1.5px #fff}
.seg{display:inline-grid;grid-auto-flow:column;gap:3px;padding:3px;border-radius:9px;background:var(--hover)}
.seg button{height:28px;min-width:44px;padding:0 10px;border:0;border-radius:7px;background:transparent;font-size:12.5px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:12px minmax(0,2fr) minmax(0,1fr) minmax(0,1.8fr) 84px;gap:14px;align-items:center;min-height:48px;padding:4px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--soft)}
.row .co{min-width:0}
.row .co > b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .co > span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .o{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st small{display:block;font-size:11.5px;color:var(--muted)}
.row .st small.late{color:var(--late)}
.row .st small.soon{color:var(--ink);font-weight:600}
.row .d{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.row.offer{grid-template-columns:12px minmax(0,2fr) 96px minmax(0,1.4fr) minmax(0,1fr)}
.empty-msg{color:var(--muted);font-size:13px;margin:6px 0}
/* Mögliche Unternehmen */
.row.firm{grid-template-columns:30px minmax(0,2fr) minmax(0,1fr) minmax(0,1.8fr) 84px}
.row.firm .rk{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.row.firm[aria-expanded="true"]{background:var(--soft);border-bottom-color:transparent}
.row.firm .st small.warn{color:var(--late)}
.row.firm .art.fst{margin:0 6px 0 0}
.row.firm .st a.flink{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.row.firm .st a.flink:hover{text-decoration-color:var(--ink)}
.row.firm .st a.srch{color:var(--muted)}
.row.firm .st small.trk{color:var(--ink2);font-weight:500;display:flex;align-items:center;gap:6px}
.row.firm .st small.trk .dot{width:8px;height:8px}
.fsep{list-style:none;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:16px 6px 6px;border-bottom:2px solid var(--ink);font-size:12px;color:var(--muted)}
.fsep b{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.fact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.firmd{list-style:none;border-bottom:1px solid var(--line);background:var(--soft);padding:2px 6px 14px 50px}
.firmd dl{margin:0;display:grid;grid-template-columns:118px minmax(0,1fr);gap:7px 14px;font-size:13px}
.firmd dt{color:var(--muted);font-size:12.5px}
.firmd dd{margin:0;min-width:0;overflow-wrap:anywhere}
.firmd dd.warn{color:var(--late)}
.firmd a{color:var(--ink);text-underline-offset:3px}
.firmd small{color:var(--muted);font-size:12px}
.fnote{font-size:12.5px;color:var(--muted);margin:0;max-width:880px}
.fnote b{color:var(--ink2);font-weight:600}
.fmore{font-size:12.5px;color:var(--muted)}
.fmore summary{cursor:pointer;width:max-content}
.fmore summary:hover{color:var(--ink)}
.fmore ul{margin:6px 0 0;padding-left:18px}
.fmore li{margin:2px 0}
@media (max-width:640px){ .row,.row.offer{grid-template-columns:12px minmax(0,1fr) minmax(0,1fr)} .row .o,.row .d,.row.offer .zd{display:none} .ctrl .lab{width:auto} .row.firm{grid-template-columns:24px minmax(0,1fr);row-gap:3px;padding-block:8px} .row.firm .st{grid-column:2} .row.firm .rk{align-self:start;padding-top:1px} .firmd{padding-left:12px} .firmd dl{grid-template-columns:minmax(0,1fr);gap:1px} .firmd dt{margin-top:7px} }

/* Detail */
.job{display:flex;flex-direction:column;gap:22px}
.back{border:0;background:none;padding:0;font-size:12.5px;color:var(--muted)}
.back:hover{color:var(--ink)}
.bare{border:0;background:transparent;width:100%;padding:5px 7px;margin-left:-7px;border-radius:6px;outline:none}
.bare:hover{background:var(--soft)}
.bare:focus{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line2)}
.bare::placeholder{color:var(--muted)}
.t1{font-size:24px;font-weight:600;letter-spacing:-.02em}
.t2{font-size:15px;color:var(--ink2)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.step{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:999px;padding:4px 12px 4px 9px;font-size:13px;font-weight:500}
.arrow{color:var(--line2)}
.nexts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nx{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.nx:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
.nx.backstep{color:var(--muted)}
.dates{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.drow{display:grid;grid-template-columns:12px minmax(0,1fr) 150px minmax(0,1fr);gap:12px;align-items:center;min-height:40px;border-bottom:1px solid var(--line);padding:0 4px}
.drow.cur{background:color-mix(in srgb,var(--c) 7%,#fff)}
.drow .dl{font-size:13px;font-weight:500}
.drow .dl small{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.drow input{font-family:var(--mono);font-size:12.5px}
.drow .info{font-size:12px;color:var(--muted)}
.drow .info.late{color:var(--late)}
.drow .info.soon{color:var(--ink);font-weight:600}
@media (max-width:640px){ .drow{grid-template-columns:12px minmax(0,1fr) 140px} .drow .info{grid-column:2/-1;padding-bottom:6px} }
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 28px}
@media (max-width:640px){ .fields{grid-template-columns:minmax(0,1fr)} }
.f{display:grid;grid-template-columns:132px minmax(0,1fr);align-items:center;min-height:38px;gap:8px;border-bottom:1px solid var(--line)}
.f > span{font-size:12.5px;color:var(--muted)}
.f.wide{grid-column:1/-1}
textarea.bare{min-height:110px;resize:vertical;line-height:1.5;margin-top:4px}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.savestate{font-size:12px;color:var(--muted)}
.btn.del{color:var(--c-a)}
.btn.del.solid{background:var(--c-a);color:#fff;border-color:var(--c-a)}
.syncpill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.syncpill:hover{background:var(--hover)}
.syncpill .sdot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.syncpill.s-ok .sdot{background:var(--c-z)}
.syncpill.s-busy .sdot{background:var(--c-prep);animation:pulse 1s ease-in-out infinite}
.syncpill.s-warn{color:#92400E;border-color:#F5D27A;background:#FFFBEB}
.syncpill.s-warn .sdot{background:var(--c-prep)}
.syncpill.s-err{color:var(--c-a);border-color:#F3B4B4;background:#FEF2F2}
.syncpill.s-err .sdot{background:var(--c-a)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.syncpill.s-busy .sdot{animation:none}}
.settings input{height:32px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;font-family:var(--mono);font-size:12.5px;min-width:0;width:min(320px,100%)}
.importbar p small + small{margin-top:4px}
.importbar{border:1.5px solid var(--ink);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.importbar p{margin:0;font-size:13.5px}
.importbar p small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.importbar .grp{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:60;max-width:calc(100% - 32px);display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast button{background:none;border:0;color:#fff;font-weight:600;padding:0;text-decoration:underline}
</style>
</head>
<body>

<div class="page">
  <header class="top">
    <div>
      <h1 class="brand">Bewerbungen</h1>
      <ul class="stats" id="stats"><li>wird geladen …</li></ul>
    </div>
    <div class="acts">
      <span class="status" id="status" aria-live="polite"></span>
      <button type="button" class="syncpill s-busy" id="syncPill" aria-live="polite" title="Synchronisierung mit GitHub"><span class="sdot"></span><span>Lädt …</span></button>
      <button class="btn" id="undoBtn" type="button" disabled>↶ Rückgängig</button>
      <button class="btn" id="exportBtn" type="button" title="Alle Bewerbungen als JSON-Datei speichern">Export</button>
      <button class="btn" id="importBtn" type="button" title="Bewerbungen aus einer JSON-Datei laden">Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="btn primary" id="addBtn" type="button">+ Neue Bewerbung</button>
    </div>
  </header>

  <div id="settingsBar" hidden></div>
  <div id="lockNote" class="importbar" hidden><p><b>Deine Bewerbungsdaten sind privat.</b><small>Sie liegen im privaten Repository bw-daten. Klick oben auf „Token eintragen“ und gib deinen Fine-grained Token ein, um sie auf diesem Gerät zu sehen und zu bearbeiten.</small></p></div>
  <div id="importBar" hidden></div>

  <section class="nexts-box" id="nextBox" aria-labelledby="nextL">
    <p class="sl" id="nextL">Als Nächstes</p>
    <ul class="agenda" id="agenda"></ul>
  </section>

  <div class="tree" id="tree" aria-label="Bewerbungspfad"></div>

  <div class="below">
    <div class="toolbar">
      <button type="button" class="tb" id="eyeBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Alle Bewerbungen</button>
      <button type="button" class="tb" id="offerBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg>Angebote <span class="n" id="offerN"></span></button>
      <button type="button" class="tb" id="firmBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16"/><path d="M15 9h4a1 1 0 0 1 1 1v11"/><path d="M2.5 21h19"/><path d="M8 8h3M8 12h3M8 16h3"/></svg>Mögliche Unternehmen <span class="n" id="firmN"></span></button>
    </div>
    <div id="detail"></div>
  </div>
</div>
<div id="toastHost"></div>

<script>
(function(){
  "use strict";
  /* ---------- fester Pfad ---------- */
  var NODES={}, ORDER=[];
  function def(id,l,c,ch){ NODES[id]={id:id,l:l,c:c,ch:ch||[]}; ORDER.push(id); }
  def("prep","In Bearbeitung","prep",["B"]);
  def("B","Bewerbung","bew",["B.Z","B.G","B.T","B.A"]);
  def("B.Z","Zusage","z");
  def("B.G","Gespräch","g",["B.G.Z","B.G.G2","B.G.A"]);
  def("B.G.Z","Zusage","z");
  def("B.G.G2","2. Gespräch","g2",["B.G.G2.Z","B.G.G2.A"]);
  def("B.G.G2.Z","Zusage","z"); def("B.G.G2.A","Absage","a");
  def("B.G.A","Absage","a");
  def("B.T","Test","t",["B.T.Z","B.T.G","B.T.A"]);
  def("B.T.Z","Zusage","z");
  def("B.T.G","Gespräch","g",["B.T.G.Z","B.T.G.G2","B.T.G.A"]);
  def("B.T.G.Z","Zusage","z");
  def("B.T.G.G2","2. Gespräch","g2",["B.T.G.G2.Z","B.T.G.G2.A"]);
  def("B.T.G.G2.Z","Zusage","z"); def("B.T.G.G2.A","Absage","a");
  def("B.T.G.A","Absage","a");
  def("B.T.A","Absage","a");
  def("B.A","Absage","a");
  var STUFEN=[["prep","In Bearbeitung"],["bew","Bewerbung"],["t","Test"],["g","Gespräch"],["g2","2. Gespräch"],["z","Zusage"],["a","Absage"]];
  var ARTEN=[["Vz","Vollzeit"],["Tz","Teilzeit"],["Tr","Trainee"],["Pr","Praktikum"]];
  var TERMIN={t:1,g:1,g2:1};
  function depth(id){ return id==="prep"?0:id.split(".").length-1; }
  function parentOf(id){ if(id==="prep") return null; if(id==="B") return "prep"; return id.slice(0,id.lastIndexOf(".")); }
  function chain(id){ if(id==="prep") return ["prep"]; var p=id.split("."), out=[]; for(var i=1;i<=p.length;i++) out.push(p.slice(0,i).join(".")); return out; }
  function chainLabel(id){ return chain(id).map(function(k){ return NODES[k].l; }).join(" → "); }

  var rows=[], loaded=false, col=null, canWrite=true, dbState="pending";
  var pending={}, timers={}, inflight={}, undoStack=[], expanded={}, nextAll=false, treeDirty=false;
  var ui={mode:"none", node:null, job:null, from:null, sort:"progress", fSt:{}, fArt:{}, fOrt:{}, fAs:{}, confirmDel:false, fsort:"rank", fStufe:{}, fTr:{}, fOpen:null, fMore:null};
  try{ var sv=JSON.parse(localStorage.getItem("bt-ui")||"{}"); if(sv.sort) ui.sort=sv.sort; if(sv.fsort==="alpha") ui.fsort="alpha"; }catch(e){}
  function saveUi(){ try{ localStorage.setItem("bt-ui",JSON.stringify({sort:ui.sort, fsort:ui.fsort})); }catch(e){} }

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function isIso(s){ return typeof s==="string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function fmt(iso){ if(!isIso(iso)) return ""; var p=iso.split("-"); return p[2]+"."+p[1]+"."+p[0]; }
  function fmtS(iso){ if(!isIso(iso)) return ""; var p=iso.split("-"); return p[2]+"."+p[1]+"."; }
  function days(a,b){ if(!isIso(a)||!isIso(b)) return null; return Math.round((Date.parse(b+"T12:00:00Z")-Date.parse(a+"T12:00:00Z"))/864e5); }
  function tage(n){ return n===1?"1 Tag":n+" Tagen"; }
  function rel(n){ return n===0?"heute":n===1?"morgen":"in "+n+" Tagen"; }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function toast(msg, undo){ var h=$("toastHost"); h.innerHTML='<div class="toast" role="status"><span>'+esc(msg)+'</span>'+(undo?'<button type="button" data-act="undo">Rückgängig</button>':'')+'</div>'; clearTimeout(toast._t); toast._t=setTimeout(function(){h.innerHTML="";}, undo?6000:2600); }
  function setStatus(m,err){ var s=$("status"); s.textContent=m||""; s.className="status"+(err?" err":""); }

  /* ---------- Daten ---------- */
  function view(id){ var r=null; for(var i=0;i<rows.length;i++) if(rows[i].id===id){ r=rows[i]; break; } if(!r) return null; return (pending[id]||inflight[id]) ? Object.assign({}, r, inflight[id]||{}, pending[id]||{}) : r; }
  function all(){ return rows.map(function(r){ return view(r.id); }); }
  function pfad(r){ if(r.pfad && NODES[r.pfad]) return r.pfad; return (Array.isArray(r.schritte)&&r.schritte.length) ? "B" : "prep"; }
  function dates(r){ return Array.isArray(r.daten) ? r.daten.filter(function(x){ return x && NODES[x.k]; }) : []; }
  function dateOf(r,k){ var D=dates(r); for(var i=0;i<D.length;i++) if(D[i].k===k) return D[i].d||""; return ""; }
  function withDate(r,k,v){ var D=dates(r).filter(function(x){ return x.k!==k; }); if(v) D.push({k:k,d:v}); return D; }
  function role(r){ return r.rolle || r.stelle || ""; }
  /* Unterlagen: anschreiben "ja" = Lebenslauf und Anschreiben (LB+AS), "nein" = nur Lebenslauf (LB), "" = offen */
  function docHtml(r){ if(r.anschreiben==="ja") return '<span class="art as" title="Lebenslauf und Anschreiben">LB+AS</span>'; if(r.anschreiben==="nein") return '<span class="art" title="Nur Lebenslauf">LB</span>'; return ''; }
  function artHtml(r){ return (r.art ? '<span class="art">'+esc(r.art)+'</span>' : '')+docHtml(r); }
  function roleLine(r){ return '<span class="rt">'+(esc(role(r))||'Rolle fehlt')+'</span>'+artHtml(r); }
  function cOf(r){ return NODES[pfad(r)].c; }

  /* Zustand einer Bewerbung: Text, Dringlichkeit, fehlendes Feld, Sortierschlüssel */
  function info(r){
    var p=pfad(r), n=NODES[p], t=today(), d, N;
    if(p==="prep"){
      if(r.schrittDatum){ N=days(t,r.schrittDatum); return {txt:(r.schritt||"Aufgabe")+" bis "+fmtS(r.schrittDatum), lvl:N<0?"late":N<=3?"soon":"muted", g:N<0?2:N<=3?0:3, v:N}; }
      return {txt:r.schritt||"noch nicht beworben", lvl:"muted", g:5, v:0};
    }
    if(n.c==="bew"){
      d=dateOf(r,"B"); if(!d) return {need:{k:"B",label:"Beworben am"}, g:1, v:0};
      N=days(d,t); return {txt:"wartet seit "+tage(Math.max(N,0)), lvl:N>=14?"late":"muted", g:4, v:-N};
    }
    if(TERMIN[n.c]){
      d=dateOf(r,p); if(!d) return {need:{k:p,label:"Termin am"}, g:1, v:0};
      N=days(t,d);
      if(N>3) return {txt:fmtS(d)+" · "+rel(N), lvl:"muted", g:3, v:N};
      if(N>=0) return {txt:fmtS(d), badge:rel(N), lvl:"soon", g:0, v:N};
      return {txt:"war "+fmtS(d)+" · Ergebnis offen", lvl:-N>=7?"late":"muted", g:2, v:N};
    }
    if(n.c==="z"){
      if(r.entscheidung==="angenommen") return {txt:"Angebot angenommen", lvl:"ok", g:5, v:0};
      if(r.entscheidung==="abgelehnt") return {txt:"Angebot von dir abgelehnt", lvl:"muted", g:6, v:0};
      if(!r.frist) return {need:{k:"frist",label:"Antwort bis"}, g:1, v:0};
      N=days(t,r.frist);
      if(N<0) return {txt:"Frist "+fmtS(r.frist)+" abgelaufen", lvl:"late", g:2, v:N};
      if(N<=3) return {txt:"Antwort "+fmtS(r.frist), badge:rel(N), lvl:"soon", g:0, v:N};
      return {txt:"Antwort bis "+fmtS(r.frist), lvl:"muted", g:3, v:N};
    }
    d=dateOf(r,p); return {txt:"Absage"+(d?" am "+fmtS(d):""), lvl:"muted", g:7, v:-(d?Date.parse(d):0)};
  }
  function prioSort(a,b){ var x=info(a), y=info(b); if(x.g!==y.g) return x.g-y.g; if(x.v!==y.v) return x.v-y.v; return (a.unternehmen||"").localeCompare(b.unternehmen||"","de"); }
  function rank(r){ var p=pfad(r), c=NODES[p].c; if(c==="z") return 100+depth(p); if(c==="a") return -100+depth(p); if(p==="prep") return -1; return depth(p)+(c==="g2"?.5:0); }

  /* ---------- Speichern ---------- */
  function errMsg(e){ var c=e&&e.code; if(c==="quota_exceeded") return "Browserspeicher voll. Bitte exportieren und alte Einträge löschen."; if(c==="no_storage") return "Dieser Browser erlaubt keinen lokalen Speicher (z. B. privates Fenster)."; return "Speichern fehlgeschlagen."; }
  function withRetry(fn){ return fn().catch(function(e){ if(e&&e.code==="unavailable") return new Promise(function(res){ setTimeout(res,400+Math.random()*600); }).then(fn); throw e; }); }
  function saveState(t){ var s=$("saveState"); if(s) s.textContent=t; }
  function queue(id, patch, now){
    if(!col||!canWrite) return;
    pending[id]=Object.assign(pending[id]||{}, patch);
    clearTimeout(timers[id]); saveState("Speichert …");
    timers[id]=setTimeout(function(){ flush(id); }, now?0:650);
  }
  function flush(id){
    clearTimeout(timers[id]);
    if(inflight[id] || !pending[id] || !col) return;
    var p=pending[id]; delete pending[id]; p.geaendert=new Date().toISOString(); inflight[id]=p;
    withRetry(function(){ return col.doc(id).update(p); })
      .then(function(){ saveState("Gespeichert"); })
      .catch(function(e){ toast(errMsg(e)); if(e&&e.code==="invalid_argument") canWrite=false; })
      .then(function(){ inflight[id]=null; if(pending[id]) flush(id); else renderAll(); });
  }
  function flushAll(){ Object.keys(pending).forEach(flush); }
  function undoable(id, patch, label){
    var r=view(id); if(!r||!col||!canWrite) return;
    var prev={}; Object.keys(patch).forEach(function(k){ prev[k]= r[k]===undefined ? (k==="daten"?[]:"") : clone(r[k]); });
    undoStack.push({id:id, prev:prev}); if(undoStack.length>40) undoStack.shift();
    queue(id, patch, true); renderAll(); if(label) toast(label, true);
  }
  function undo(){
    var u=undoStack.pop(); $("toastHost").innerHTML="";
    if(!u){ renderAll(); return; }
    if(u.snapshot){ replaceStore(u.snapshot); toast("Import rückgängig gemacht"); renderAll(); return; }
    if(u.created){ if(ui.job===u.id) show("none"); clearTimeout(timers[u.id]); delete pending[u.id]; withRetry(function(){ return col.doc(u.id).delete(); }).then(function(){ toast("Neue Bewerbung entfernt"); }).catch(function(e){ toast(errMsg(e)); }); }
    else if(u.deleted){ withRetry(function(){ return col.doc(u.id).set(u.deleted); }).then(function(){ toast("Wiederhergestellt"); }).catch(function(e){ toast(errMsg(e)); }); }
    else { queue(u.id, clone(u.prev), true); toast("Rückgängig gemacht"); }
    renderAll();
  }
  function moveJob(id, to){
    var r=view(id); if(!r||!NODES[to]) return; var from=pfad(r); if(from===to) return;
    var keep=chain(to), D=dates(r).filter(function(x){ return keep.indexOf(x.k)>=0; });
    var c=NODES[to].c;
    // Bewerbung, Zusage, Absage bekommen heute; Termine (Test, Gespräche) trägst du selbst ein
    if(to!=="prep" && !TERMIN[c] && !D.some(function(x){ return x.k===to; }) && (to!=="B" || from==="prep")) D.push({k:to, d:today()});
    var patch={pfad:to, daten:D};
    undoable(id, patch, (r.unternehmen||"Ohne Namen")+" → "+NODES[to].l+(TERMIN[c]?". Termin eintragen":""));
  }

  /* ---------- Kopf und Als Nächstes ---------- */
  function renderStats(){
    var el=$("stats");
    if(!loaded){ el.innerHTML='<li>'+(dbState==="none"?"Speichern ist in dieser Ansicht nicht verfügbar.":"wird geladen …")+'</li>'; return; }
    var c={prep:0,run:0,z:0,a:0};
    all().forEach(function(r){ var k=cOf(r); if(k==="prep") c.prep++; else if(k==="z") c.z++; else if(k==="a") c.a++; else c.run++; });
    el.innerHTML='<li class="c-prep"><span class="dot"></span><b>'+c.prep+'</b> in Bearbeitung</li><li class="c-g"><span class="dot"></span><b>'+c.run+'</b> laufend</li><li class="c-z"><span class="dot"></span><b>'+c.z+'</b> Zusage</li><li class="c-a"><span class="dot"></span><b>'+c.a+'</b> Absage</li>';
    $("undoBtn").disabled=!undoStack.length;
    $("addBtn").disabled=!(loaded&&canWrite&&col&&token());
    $("offerN").textContent=c.z?c.z:"";
  }
  function agendaItems(){
    var t=today(), out=[];
    all().forEach(function(r){
      var p=pfad(r), n=NODES[p], c=n.c, i=info(r), d;
      if(TERMIN[c]){
        d=dateOf(r,p);
        if(!d) out.push({id:r.id,c:c,d:"",co:r.unternehmen,w:n.l+" · Termin eintragen",tag:["need","Datum fehlt"]});
        else { var N=days(t,d); if(N<0) out.push({id:r.id,c:c,d:d,co:r.unternehmen,w:n.l+" · Ergebnis eintragen",tag:["late","vorbei"]}); else if(N<=21) out.push({id:r.id,c:c,d:d,co:r.unternehmen,w:n.l,tag:[N<=3?"soon":"",rel(N)]}); }
      }
      if(c==="z" && !r.entscheidung){
        if(!r.frist) out.push({id:r.id,c:c,d:"",co:r.unternehmen,w:"Angebot · Antwortfrist eintragen",tag:["need","Frist fehlt"]});
        else { var M=days(t,r.frist); out.push({id:r.id,c:c,d:r.frist,co:r.unternehmen,w:"Antwort auf Angebot",tag:[M<0?"late":M<=3?"soon":"",M<0?"abgelaufen":rel(M)]}); }
      }
      if(c==="bew" && !dateOf(r,"B")) out.push({id:r.id,c:c,d:"",co:r.unternehmen,w:"Bewerbungsdatum eintragen",tag:["need","Datum fehlt"]});
      if(c==="bew" && i.lvl==="late") out.push({id:r.id,c:c,d:dateOf(r,"B"),co:r.unternehmen,w:"seit "+tage(days(dateOf(r,"B"),t))+" keine Rückmeldung",tag:["late","nachfassen?"]});
      if(c!=="a" && (r.schritt||r.schrittDatum)){ var A=r.schrittDatum?days(t,r.schrittDatum):null; out.push({id:r.id,c:c,d:r.schrittDatum||"",co:r.unternehmen,w:"Aufgabe: "+(r.schritt||"ohne Beschreibung"),tag:A==null?null:[A<0?"late":A<=3?"soon":"",A<0?"überfällig":rel(A)]}); }
    });
    out.sort(function(a,b){ var x=a.d||"0000", y=b.d||"0000"; return x<y?-1:x>y?1:0; });
    return out;
  }
  function renderAgenda(){
    var el=$("agenda"); if(!loaded){ el.innerHTML=""; return; }
    var items=agendaItems(), show=nextAll?items:items.slice(0,5);
    var lab=$("nextL"); lab.innerHTML='Als Nächstes'+(items.length>5?'<button type="button" class="linkbtn" data-act="nextAll">'+(nextAll?'weniger':'alle '+items.length+' anzeigen')+'</button>':'');
    if(!items.length){ el.innerHTML='<li class="static"><span class="empty-msg" style="margin:4px 0">Keine Termine, Fristen oder Aufgaben. Sobald eine Bewerbung im Test oder Gespräch steht, erscheint ihr Termin hier.</span></li>'; return; }
    el.innerHTML=show.map(function(it){
      return '<li class="c-'+it.c+'" data-open-job="'+esc(it.id)+'" tabindex="0"><span class="d">'+(it.d?esc(fmt(it.d)):'–')+'</span><span class="dot"></span><span class="w">'+esc(it.co||"Ohne Namen")+' <span>· '+esc(it.w)+'</span></span>'+(it.tag?'<span class="tag '+it.tag[0]+'">'+esc(it.tag[1])+'</span>':'<span></span>')+'</li>';
    }).join("");
  }

  /* ---------- Baum ---------- */
  var MAXS=4, HEAD=26, ENT=70, EGAP=6, GAP=16;
  function groups(){ var g={}; ORDER.forEach(function(k){ g[k]=[]; }); all().forEach(function(r){ g[pfad(r)].push(r); }); Object.keys(g).forEach(function(k){ g[k].sort(prioSort); }); return g; }
  function boxH(n,key){ var s=expanded[key]?n:Math.min(n,MAXS); return HEAD + (s?6+s*(ENT+EGAP):0) + (n>MAXS?22:0) + 4; }
  function statusHtml(r){
    var i=info(r);
    if(i.need){
      var val = i.need.k==="frist" ? (r.frist||"") : dateOf(r,i.need.k);
      return '<label class="need" title="'+esc(i.need.label)+' eintragen"><span>'+esc(i.need.label)+'</span><input type="date" data-tfield="'+esc(i.need.k)+'" data-job="'+esc(r.id)+'" value="'+esc(val)+'"'+(canWrite?'':' disabled')+'></label>';
    }
    return '<span class="es '+(i.lvl||"")+'">'+(i.badge?'<span class="b">'+esc(i.badge)+'</span> ':'')+esc(i.txt)+'</span>';
  }
  function entHtml(r){
    var i=info(r);
    return '<div class="ent c-'+cOf(r)+(i.lvl==="soon"?' soon':'')+(ui.job===r.id?' sel':'')+'" data-job="'+esc(r.id)+'" tabindex="0" title="'+esc([r.unternehmen,role(r),r.ort].filter(Boolean).join(" · "))+'"><span class="grip" aria-hidden="true"></span><span class="en">'+esc(r.unternehmen||"Ohne Namen")+'</span><span class="er">'+roleLine(r)+'</span>'+statusHtml(r)+'</div>';
  }
  function nodeHtml(k,G,style){
    var n=NODES[k], list=G[k], c=list.length, show=expanded[k]?list:list.slice(0,MAXS);
    var h='<div class="nb c-'+n.c+(c?'':' empty')+(ui.mode==="node"&&ui.node===k?' sel':'')+'" data-node="'+k+'"'+(style?' style="'+style+'"':'')+'>';
    h+='<div class="nh" data-open-node="'+k+'" tabindex="0" role="button" aria-label="'+esc(chainLabel(k))+', '+c+' Bewerbungen"><span class="nd" data-anchor="'+k+'"></span><span class="nl">'+esc(n.l)+'</span><span class="nc">'+(c||"")+'</span></div>';
    if(c) h+='<div class="ents">'+show.map(entHtml).join("")+'</div>';
    if(c>MAXS) h+='<button type="button" class="more" data-act="more" data-key="'+k+'">'+(expanded[k]?'weniger':'+ '+(c-MAXS)+' weitere')+'</button>';
    return h+'</div>';
  }
  var LAY=null;
  function treeBusy(){ var a=document.activeElement; return a && $("tree").contains(a) && a.matches("input"); }
  function renderTree(){
    var host=$("tree");
    if(drag){ treeDirty=true; return; }
    if(treeBusy()){ treeDirty=true; return; }
    treeDirty=false;
    if(!loaded){ host.innerHTML='<p class="empty-msg">wird geladen …</p>'; host.style.height=""; return; }
    var G=groups(), W=host.clientWidth||1000;
    if(W<720){ renderOutline(host,G); return; }
    host.classList.remove("outline");
    var colW=W/5, bw=Math.max(140, colW-40);
    var H={}, SUB={}, Y={};
    ORDER.forEach(function(k){ H[k]=boxH(G[k].length,k); });
    function sub(k){ var n=NODES[k]; if(!n.ch.length) return SUB[k]=H[k]; var s=0; n.ch.forEach(function(c,i){ s+=sub(c)+(i?GAP:0); }); return SUB[k]=Math.max(H[k],s); }
    sub("B");
    function place(k,top){
      var n=NODES[k];
      if(!n.ch.length){ Y[k]=top+(SUB[k]-H[k])/2; return; }
      var s=0; n.ch.forEach(function(c,i){ s+=SUB[c]+(i?GAP:0); });
      var t=top+(SUB[k]-s)/2;
      n.ch.forEach(function(c){ place(c,t); t+=SUB[c]+GAP; });
      var first=Y[n.ch[0]], last=Y[n.ch[n.ch.length-1]];
      Y[k]=Math.min(Math.max((first+last)/2, top), top+SUB[k]-H[k]);
    }
    var offset=H.prep+48; place("B",offset); Y.prep=0;

        if(res.status===401) throw {msg:"Token ungültig oder abgelaufen"};

  /* ---------- Speicher: GitHub (data.json) mit localStorage als Zwischenspeicher ---------- */
  /* Die Seite liegt öffentlich, die Daten im privaten Repository bw-daten */
  var OWNER="Manav25-create-create", REPO="bw-daten", PATH="data.json", BRANCH="main";
  var API="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+PATH;

  var FIELDS=["unternehmen","rolle","art","stelle","ort","weg","gehalt","eintritt","ansprechpartner","schritt","schrittDatum","notizen","pfad","frist","entscheidung","anschreiben","firma","erstellt","geaendert"];
  function newId(){ return "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function nowIso(){ return new Date().toISOString(); }
  function clean(r){
    if(!r||typeof r!=="object") return null;
    var o={id: (typeof r.id==="string" && /^[A-Za-z0-9_.:-]{1,80}$/.test(r.id)) ? r.id : newId()};
    FIELDS.forEach(function(k){ o[k] = r[k]==null ? "" : String(r[k]); });
    if(!NODES[o.pfad]) o.pfad = (Array.isArray(r.schritte)&&r.schritte.length) ? "B" : "prep";
    o.daten = Array.isArray(r.daten) ? r.daten.filter(function(x){ return x && NODES[x.k] && isIso(x.d); }).map(function(x){ return {k:x.k, d:x.d}; }) : [];
    if(["","angenommen","abgelehnt"].indexOf(o.entscheidung)<0) o.entscheidung="";
    if(["","ja","nein"].indexOf(o.anschreiben)<0) o.anschreiben="";
    if(!isIso(o.frist)) o.frist=""; if(!isIso(o.eintritt)) o.eintritt=""; if(!isIso(o.schrittDatum)) o.schrittDatum="";
    return o;
  }
  function parseDoc(o){
    var list=Array.isArray(o)?o:(o&&Array.isArray(o.bewerbungen)?o.bewerbungen:[]), s={}, t={};
    list.forEach(function(r){ var c=clean(r); if(c) s[c.id]=c; });
    if(o && o.geloescht && typeof o.geloescht==="object") Object.keys(o.geloescht).forEach(function(id){ var v=o.geloescht[id]; if(typeof v==="string" && /^\d{4}-\d{2}-\d{2}T/.test(v)) t[id]=v; });
    return {store:s, tomb:t};
  }
  function buildDoc(){
    var cut=new Date(Date.now()-180*864e5).toISOString(), g={};
    Object.keys(TOMB).sort().forEach(function(id){ if(TOMB[id]>=cut && !STORE[id]) g[id]=TOMB[id]; });
    return {app:"bw-tracker", version:2, aktualisiert:nowIso(), bewerbungen:Object.keys(STORE).sort().map(function(id){ return STORE[id]; }), geloescht:g};
  }
  function canon(store,tomb){ return JSON.stringify([Object.keys(store).sort().map(function(id){ return store[id]; }), Object.keys(tomb).filter(function(id){ return !store[id]; }).sort().map(function(id){ return [id,tomb[id]]; })]); }

  /* Zwischenspeicher */
  function readCache(){
    STORE={}; TOMB={}; SHA=null; DIRTY=false;
    if(!token()) return;
    try{
      var raw=localStorage.getItem(KEY); storageOk=true; if(!raw) return;
      var o=JSON.parse(raw), p=parseDoc(o), same=o&&o.repo===OWNER+"/"+REPO;
      STORE=p.store; TOMB=p.tomb; SHA=(same&&typeof o.sha==="string")?o.sha:null; DIRTY=!!(o&&o.dirty);
    }catch(e){ storageOk=false; }
  }
  function clearCache(){ try{ localStorage.removeItem(KEY); }catch(e){} STORE={}; TOMB={}; SHA=null; DIRTY=false; CHANGE++; }
  function writeCache(){
    try{
      if(!token()) return null;
      localStorage.setItem(KEY, JSON.stringify({version:2, repo:OWNER+"/"+REPO, sha:SHA, dirty:DIRTY, bewerbungen:Object.keys(STORE).map(function(id){ return STORE[id]; }), geloescht:TOMB}));
      return null;
    }catch(e){ return {code:(e&&(e.name==="QuotaExceededError"||e.code===22))?"quota_exceeded":"no_storage"}; }
  }
  function token(){ try{ return localStorage.getItem(TKEY)||""; }catch(e){ return ""; } }

  /* Zusammenführen pro Eintrag nach Änderungszeit, Löschungen über Zeitstempel */
  function merge(aS,aT,bS,bT){
    var s={}, t={}, ids={};
    Object.keys(aS).concat(Object.keys(bS),Object.keys(aT),Object.keys(bT)).forEach(function(id){ ids[id]=1; });
    Object.keys(ids).forEach(function(id){
      var a=aS[id], b=bS[id], pick=a&&b ? ((b.geaendert||"")>(a.geaendert||"")?b:a) : (a||b);
      var ta=aT[id]||"", tb=bT[id]||"", tomb=ta>tb?ta:tb;
      if(pick && (!tomb || (pick.geaendert||"")>tomb)) s[id]=clone(pick);
      else if(tomb) t[id]=tomb;
    });
    return {store:s, tomb:t};
  }

  function syncRows(){ rows=Object.keys(STORE).map(function(id){ return clone(STORE[id]); }); loaded=true; }
  function emit(){ syncRows(); renderAll(); }
  function commit(){ DIRTY=true; CHANGE++; var err=writeCache(); syncRows(); setTimeout(renderAll,0); scheduleSync(); return err?Promise.reject(err):Promise.resolve(); }
  function replaceStore(obj){
    var now=nowIso(), next=clone(obj);
    Object.keys(STORE).forEach(function(id){ if(!next[id]) TOMB[id]=now; });
    Object.keys(next).forEach(function(id){ next[id].geaendert=now; delete TOMB[id]; });
    STORE=next; commit().catch(function(e){ toast(errMsg(e)); });
  }
  col={doc:function(id){ id=id||newId(); return {id:id,
    update:function(p){ if(!STORE[id]) return Promise.reject({code:"invalid_argument"}); Object.keys(p).forEach(function(k){ STORE[id][k]=clone(p[k]); }); if(!p.geaendert) STORE[id].geaendert=nowIso(); return commit(); },
    set:function(p){ var o=clone(p); o.id=id; o.geaendert=nowIso(); STORE[id]=o; delete TOMB[id]; return commit(); },
    delete:function(){ delete STORE[id]; TOMB[id]=nowIso(); return commit(); } }; }};

  /* GitHub-API */
  function b64enc(str){ var bytes=new TextEncoder().encode(str), bin=""; for(var i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); }
  function b64dec(b64){ var bin=atob(String(b64).replace(/\s/g,"")), bytes=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
  function hdrs(json){ var h={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}, t=token(); if(t) h.Authorization="Bearer "+t; if(json) h["Content-Type"]="application/json"; return h; }
  function apiError(res, body){
    var m=(body&&body.message)||"", s=res.status;
    if(s===401) return {kind:"auth", msg:"Token ungültig oder abgelaufen"};
    if(s===403 && res.headers.get("x-ratelimit-remaining")==="0") return {kind:"limit", msg:"GitHub-Abruflimit erreicht, später erneut"};
    if(s===403) return {kind:"auth", msg:"Token ohne Schreibrecht für data.json"};
    if(s===404) return {kind:"auth", msg:"Kein Zugriff auf bw-daten oder data.json fehlt"};
    if(s===409 || (s===422 && /sha/i.test(m))) return {kind:"conflict", msg:"Konflikt"};
    return {kind:"other", msg:"GitHub-Fehler "+s+(m?": "+m:"")};
  }
  function pull(){
    if(!token()) return Promise.reject({kind:"notoken"});
    return fetch(API+"?ref="+BRANCH+"&_="+Date.now(), {headers:hdrs(false), cache:"no-store"}).then(function(res){
      return res.json().catch(function(){ return null; }).then(function(body){
        if(res.status===404) throw {kind:"auth", msg:"Kein Zugriff auf bw-daten oder data.json fehlt"};
        if(!res.ok) throw apiError(res, body);
        var o; try{ o=JSON.parse(b64dec(body.content)); }catch(e){ throw {kind:"other", msg:"data.json ist beschädigt"}; }
        return {sha:body.sha, doc:parseDoc(o)};
      });
    }, function(){ throw {kind:"offline"}; });
  }
  function put(){
    var body={message:"Bewerbungen aktualisiert", content:b64enc(JSON.stringify(buildDoc(),null,2)+"\n"), branch:BRANCH};
    if(SHA) body.sha=SHA;
    return fetch(API, {method:"PUT", headers:hdrs(true), body:JSON.stringify(body), cache:"no-store"}).then(function(res){
      return res.json().catch(function(){ return null; }).then(function(b){ if(!res.ok) throw apiError(res,b); return b.content.sha; });
    }, function(){ throw {kind:"offline"}; });
  }

  /* Ablauf */
  function setSync(state,msg){ sync.state=state; sync.msg=msg||""; renderSync(); }
  function scheduleSync(delay){
    clearTimeout(sync.timer); clearTimeout(sync.retry);
    if(!DIRTY){ return; }
    if(!token()){ setSync("notoken"); return; }
    setSync("busy");
    sync.timer=setTimeout(pushNow, delay==null?2000:delay);
  }
  function pushNow(attempt){
    attempt=attempt||0;
    if(!DIRTY) { setSync("ok"); return; }
    if(!token()){ setSync("notoken"); return; }
    if(sync.inflight){ sync.again=true; return; }
    sync.inflight=true; setSync("busy");
    var start=CHANGE;
    put().then(function(newSha){
      SHA=newSha; if(CHANGE===start) DIRTY=false;
      writeCache(); sync.savedAt=nowIso(); sync.inflight=false;
      sync.again=false; if(DIRTY) scheduleSync(); else setSync("ok");
    }).catch(function(e){
      sync.inflight=false;
      if(e.kind==="conflict" && attempt<3){
        pull().then(function(r){
          var m=merge(STORE,TOMB,r.doc.store,r.doc.tomb);
          STORE=m.store; TOMB=m.tomb; SHA=r.sha; writeCache(); emit();
          if(canon(STORE,TOMB)===canon(r.doc.store,r.doc.tomb)){ DIRTY=false; writeCache(); setSync("ok"); }
          else pushNow(attempt+1);
          toast("Änderung von einem anderen Gerät zusammengeführt");
        }).catch(fail);
      } else fail(e);
    });
  }
  function fail(e){
    if(e.kind==="notoken"){ setSync("locked"); return; }
    if(e.kind==="offline"){ setSync("offline"); clearTimeout(sync.retry); sync.retry=setTimeout(function(){ if(DIRTY) pushNow(); else refresh(); },30000); }
    else setSync("error", e.msg||"Fehler beim Speichern");
  }
  function refresh(){
    if(!token()){ clearTimeout(sync.timer); setSync("locked"); return; }
    if(sync.inflight) return;
    sync.lastPull=Date.now();
    if(sync.state!=="busy") setSync("load");
    sync.inflight=true;
    pull().then(function(r){
      sync.inflight=false;
      if(DIRTY){
        var m=merge(STORE,TOMB,r.doc.store,r.doc.tomb);
        STORE=m.store; TOMB=m.tomb; SHA=r.sha;
        DIRTY = canon(STORE,TOMB)!==canon(r.doc.store,r.doc.tomb);
      } else { STORE=r.doc.store; TOMB=r.doc.tomb; SHA=r.sha; }
      writeCache(); emit();
      if(DIRTY) scheduleSync(0); else setSync("ok");
    }).catch(function(e){ sync.inflight=false; fail(e); });
  }

  /* Statusanzeige und Einstellungen */
  function renderSync(){
    var el=$("syncPill"); if(!el) return;
    var t={load:["busy","Lädt …"], busy:["busy","Speichert …"], ok:["ok","Gespeichert"], offline:["off","Offline · lokal gesichert"], notoken:["warn","Token fehlt"], locked:["warn","Token eintragen"], error:["err",sync.msg||"Fehler"]}[sync.state]||["off",""];
    el.className="syncpill s-"+t[0]; el.querySelector("span:last-child").textContent=t[1];
    el.title = sync.state==="ok" && sync.savedAt ? "Zuletzt gespeichert "+new Date(sync.savedAt).toLocaleTimeString("de-DE") : "Synchronisierung mit GitHub";
    if(!$("settingsBar").hidden) renderSettings();
    var lk=$("lockNote"); if(lk) lk.hidden=!!token();
    $("addBtn").disabled=!(loaded&&canWrite&&col&&token());
  }
  var settingsOpen=false, tokDelArmed=false;
  function renderSettings(){
    var bar=$("settingsBar");
    if(!settingsOpen){ bar.hidden=true; bar.innerHTML=""; return; }
    var t=token(), keep=$("tokenInput")?$("tokenInput").value:"";
    bar.hidden=false;
    bar.innerHTML='<div class="importbar settings"><p><b>Synchronisierung mit GitHub</b><small>Daten: privates Repository '+esc(OWNER+"/"+REPO)+', Datei '+esc(PATH)+' auf '+esc(BRANCH)+'. Der Token bleibt nur in diesem Browser (localStorage) und wird nie hochgeladen. Ohne Token zeigt die Seite keine Daten. „Token entfernen“ löscht auch die lokale Kopie auf diesem Gerät.</small><small>'+(t?'Token gespeichert, endet auf …'+esc(t.slice(-4)):'Kein Token gespeichert')+' · Status: '+esc($("syncPill").textContent)+'</small></p><span class="grp"><input type="password" id="tokenInput" placeholder="github_pat_…" autocomplete="off" spellcheck="false" aria-label="Fine-grained Token" value="'+esc(keep)+'"><button type="button" class="btn primary" data-act="tokSave">Token speichern</button>'+(t?(tokDelArmed?'<button type="button" class="btn del solid" data-act="tokDelYes">Ungespeicherte Änderungen verwerfen und entfernen</button>':'<button type="button" class="btn" data-act="tokDel">Token entfernen</button>'):'')+'<button type="button" class="btn" data-act="syncNow">Jetzt abgleichen</button><button type="button" class="btn" data-act="setClose">Schließen</button></span></div>';
  }
  document.addEventListener("click", function(ev){
    var t=ev.target.closest&&ev.target.closest('[data-act^="tok"],[data-act="setClose"],[data-act="syncNow"],#syncPill'); if(!t) return;
    if(t.id==="syncPill"){ settingsOpen=!settingsOpen; renderSettings(); if(settingsOpen){ var i=$("tokenInput"); if(i&&!token()) i.focus(); } return; }
    var a=t.getAttribute("data-act");
    if(a==="setClose"){ settingsOpen=false; renderSettings(); }
    else if(a==="tokSave"){
      var v=($("tokenInput").value||"").trim();
      if(!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(v)){ toast("Das sieht nicht nach einem GitHub-Token aus (beginnt mit github_pat_)."); return; }
      try{ localStorage.setItem(TKEY,v); }catch(e){ toast("Token konnte nicht gespeichert werden."); return; }
      $("tokenInput").value=""; toast("Token gespeichert"); resetFirms(); readCache(); emit(); refresh(); renderSettings(); if(ui.mode==="firms") loadFirms();
    }
    else if(a==="tokDel" && DIRTY){ tokDelArmed=true; renderSettings(); }
    else if(a==="tokDel"||a==="tokDelYes"){
      tokDelArmed=false; clearTimeout(sync.timer);
      clearCache(); resetFirms(); try{ localStorage.removeItem(TKEY); }catch(e){}
      undoStack.length=0; show("none"); emit(); setSync("locked"); renderSettings(); toast("Token und lokale Daten auf diesem Gerät entfernt");
    }
    else if(a==="syncNow"){ if(DIRTY) pushNow(); else refresh(); }
  });

  /* ---------- Export und Import ---------- */
  function exportJson(){
    flushAll();
    var data={app:"bw-tracker", version:2, exportiert:nowIso(), bewerbungen:Object.keys(STORE).map(function(id){ return STORE[id]; })};
    var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="bewerbungen-"+today()+".json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    toast(data.bewerbungen.length+" Bewerbungen exportiert");
  }
  var importData=null;
  function renderImportBar(){
    var bar=$("importBar");
    if(!importData){ bar.hidden=true; bar.innerHTML=""; return; }
    var n=importData.length, m=Object.keys(STORE).length, neu=importData.filter(function(r){ return !STORE[r.id]; }).length;
    bar.hidden=false;
    bar.innerHTML='<div class="importbar"><p><b>'+n+' '+(n===1?'Bewerbung':'Bewerbungen')+'</b> in „'+esc(importData.name)+'“<small>Aktuell gespeichert: '+m+'. Zusammenführen ergänzt '+neu+' neue und überschreibt gleiche Einträge. Ersetzen löscht den aktuellen Stand. Beides lässt sich rückgängig machen.</small></p><span class="grp"><button type="button" class="btn" data-act="impCancel">Abbrechen</button><button type="button" class="btn" data-act="impMerge">Zusammenführen</button><button type="button" class="btn primary" data-act="impReplace">Ersetzen</button></span></div>';
  }
  function readImport(file){
    var fr=new FileReader();
    fr.onload=function(){
      var list;
      try{ var o=JSON.parse(fr.result); list=Array.isArray(o)?o:(o&&Array.isArray(o.bewerbungen)?o.bewerbungen:null); }catch(e){ list=null; }
      if(!list){ toast("Die Datei ist kein gültiger Export des Trackers."); return; }
      var out=list.map(clean).filter(Boolean);
      if(!out.length){ toast("In der Datei stehen keine Bewerbungen."); return; }
      out.name=file.name; importData=out; renderImportBar();
    };
    fr.onerror=function(){ toast("Datei konnte nicht gelesen werden."); };
    fr.readAsText(file);
  }
  function applyImport(mode){
    if(!importData) return;
    flushAll();
    undoStack.push({snapshot:clone(STORE)});
    var next = mode==="replace" ? {} : clone(STORE);
    importData.forEach(function(r){ next[r.id]=clone(r); });
    var n=importData.length; importData=null; renderImportBar();
    show("none"); replaceStore(next);
    toast(n+" Bewerbungen "+(mode==="replace"?"importiert, alter Stand ersetzt":"zusammengeführt"), true);
  }
  $("exportBtn").addEventListener("click", exportJson);
  $("importBtn").addEventListener("click", function(){ var f=$("importFile"); f.value=""; f.click(); });
  $("importFile").addEventListener("change", function(){ var f=this.files&&this.files[0]; if(f) readImport(f); this.value=""; });
  document.addEventListener("click", function(ev){
    var t=ev.target.closest&&ev.target.closest('[data-act^="imp"]'); if(!t) return;
    var a=t.getAttribute("data-act");
    if(a==="impCancel"){ importData=null; renderImportBar(); }
    else if(a==="impMerge") applyImport("merge");
    else if(a==="impReplace") applyImport("replace");
  });

  /* Abgleich bei Rückkehr, Netz wieder da, Tabwechsel, Schließen */
  window.addEventListener("storage", function(ev){ if(ev.key===KEY){ readCache(); emit(); } if(ev.key===TKEY){ resetFirms(); readCache(); emit(); refresh(); renderSync(); if(ui.mode==="firms") loadFirms(); } });
  window.addEventListener("online", function(){ if(DIRTY) pushNow(); else refresh(); });
  window.addEventListener("offline", function(){ setSync("offline"); });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="hidden"){ flushAll(); if(DIRTY && token()){ clearTimeout(sync.timer); pushNow(); } }
    else if(Date.now()-sync.lastPull>30000) refresh();
  });
  window.addEventListener("focus", function(){ if(Date.now()-sync.lastPull>30000) refresh(); });
  window.addEventListener("beforeunload", function(ev){ if(DIRTY && token()){ ev.preventDefault(); ev.returnValue=""; } });

  /* Start: sofort aus dem Zwischenspeicher, dann von GitHub */
  readCache(); dbState="ok";
  if(!storageOk) setStatus("Lokaler Speicher nicht verfügbar. Der Token muss bei jedem Öffnen neu eingetragen werden.", true);
  emit(); renderSync();
  refresh();
})();
</script>
</body>
</html>
